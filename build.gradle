plugins {
	id "architectury-plugin" version "3.4.160"
	id "dev.architectury.loom" version "1.10.431" apply false
	id "base"
}

architectury {
	minecraft = rootProject.minecraft_version
}

configure(allprojects) {
	apply plugin: "architectury-plugin"

	version = rootProject.mod_version + "+" + minecraft_version
	group = project.maven_group

	repositories {
		mavenLocal()
		maven { url = "https://maven.minecraftforge.net/" }
		maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
		maven { url = "https://maven.aliyun.com/repository/public/" }
		maven { url = "https://maven.terraformersmc.com/" }
		maven { url = "https://bmclapi2.bangbang93.com/maven/" }
		maven { url = "https://repo1.maven.org/maven2/" }
	}
}

configure(subprojects) {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	configurations {
		shadowCommon
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
		implementation files("../checkouts/${rootProject.minecraft_version}/mtr-common.jar")
		// mixin (fabric 提供的 spongepowered fork)
		compileOnly "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
		annotationProcessor "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = 17
	}
}

tasks.register("setupMtr") {
	// 已预置 checkouts/1.20.1 下的 dev jar
}

// Check that the classes the mixins inject into still have the methods the
// mixins target.
//
// Two of the three mixins patch MTR (mtr.client.ClientCache and
// mtr.render.RenderRailwaySign). MTR is a separate mod that gets updated on
// its own schedule, so the moment MTR renames or reshapes a method, the
// mixin stops matching. Mixin does not complain about that in a way we would
// notice: the injection is simply skipped, the feature quietly stops
// working, and the build stays green.
//
// This task reads the MTR jar that the project builds against and checks
// that every injection target is still there. It parses the class file
// constant pool instead of grepping the bytes, so a name that only shows up
// as some other kind of constant does not count as a hit.
//
// Usage: gradle checkMixinTargets
tasks.register("checkMixinTargets") {
	group = "verification"
	description = "Checks that the classes and methods the mixins inject into still exist in the MTR jar the project builds against."
	doLast {
		def mtrJar = file("checkouts/${rootProject.minecraft_version}/mtr-common.jar")
		if (!mtrJar.exists()) {
			// The whole build depends on this jar anyway (the subprojects put
			// it on their compile classpath), so a missing one is not a
			// mixin problem. Say so instead of blaming the mixins.
			logger.lifecycle("checkMixinTargets: skipped, ${mtrJar} is not present")
			return
		}

		// The classes the mixins inject into, grouped by the jar they live in.
		// Two of them are MTR classes, one is a Minecraft class.
		def mtrTargets = [
			"mtr/client/ClientCache.class"        : ["refreshDynamicResources"],
			"mtr/render/RenderRailwaySign.class"  : ["drawSign"],
		]
		def mcTargets = [
			"com/mojang/blaze3d/platform/GlStateManager.class": ["_texImage2D", "_texSubImage2D", "_getTexImage"],
		]
		// Pull the Utf8 entries out of a class file constant pool. A plain
		// byte search would also hit names that are stored as other kinds of
		// constant, and that would let a renamed method pass.
		def utf8Constants = { byte[] bytes ->
			def result = [] as Set
			if (bytes.length < 10) return result
			def pos = 8
			def count = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
			pos += 2
			def i = 1
			while (i < count && pos < bytes.length) {
				def tag = bytes[pos] & 0xFF
				pos++
				switch (tag) {
					case 1: // Utf8
						if (pos + 2 > bytes.length) return result
						def len = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
						pos += 2
						if (pos + len > bytes.length) return result
						result.add(new String(bytes, pos, len, "UTF-8"))
						pos += len
						break
					case 7: case 8: case 16: case 19: case 20:
						pos += 2
						break
					case 15:
						pos += 3
						break
					case 3: case 4: case 9: case 10: case 11: case 12: case 17: case 18:
						pos += 4
						break
					case 5: case 6:
						pos += 8
						i++ // takes two slots
						break
					default:
						return result
				}
				i++
			}
			return result
		}

		def failures = []
		// Look the Minecraft class up in the compile classpath: the loom
		// cache path is machine specific, the classpath is not.
		def mcJar = null
		try {
			// The root project does not apply loom, so it has no Minecraft
			// classpath of its own. Look at the subprojects, they do.
			def candidates = []
			project.subprojects.each { sub ->
				def cfg = sub.configurations.findByName("compileClasspath")
				if (cfg != null) {
					try { candidates.addAll(cfg.files) } catch (Exception ignored) { }
				}
			}
			candidates.each { f ->
				if (mcJar != null || !f.name.endsWith(".jar")) return
				def z = null
				try {
					z = new java.util.zip.ZipFile(f)
					if (z.getEntry("com/mojang/blaze3d/platform/GlStateManager.class") != null) {
						mcJar = f
					}
				} catch (Exception ignored) {
					// not a readable zip, ignore
				} finally {
					if (z != null) z.close()
				}
			}
		} catch (Exception e) {
			logger.lifecycle("checkMixinTargets: could not scan the classpath for the Minecraft jar: ${e.message}")
		}
		if (mcJar == null) {
			logger.lifecycle("checkMixinTargets: skipped the Minecraft targets, no jar with GlStateManager was found on the classpath")
		}

		def checkJar = { String label, File jar, Map classTargets ->
			def zip = new java.util.zip.ZipFile(jar)
			try {
				classTargets.each { classPath, methods ->
					def entry = zip.getEntry(classPath)
					if (entry == null) {
						failures << "${classPath} is not in ${jar.name} (the dependency changed its package layout?)"
						return
					}
					def names = utf8Constants(zip.getInputStream(entry).bytes)
					methods.each { method ->
						if (!names.contains(method)) {
							failures << "${classPath} no longer has a method named '${method}' (${label} renamed it; the mixin will silently stop applying)"
						}
					}
					if (!failures.any { it.contains(classPath) }) {
						logger.lifecycle("checkMixinTargets: ${classPath} still provides ${methods.join(", ")}")
					}
				}
			} finally {
				zip.close()
			}
		}

		checkJar("MTR", mtrJar, mtrTargets)
		if (mcJar != null) {
			checkJar("Minecraft", mcJar, mcTargets)
		}

		def checkedCount = mtrTargets.size() + (mcJar != null ? mcTargets.size() : 0)
		if (!failures.isEmpty()) {
			throw new GradleException("checkMixinTargets failed:\n  - " + failures.join("\n  - "))
		}
		logger.lifecycle("checkMixinTargets: OK (${checkedCount} mixin target class(es) verified)")
	}
}

// Packaging check for the mixin setup.
//
// The mixin config is only wired up inside the built jars: Fabric declares it
// in fabric.mod.json ("mixins"), Forge declares it through the jar manifest
// ("MixinConfigs: shmetro.mixins.json", which is what Architectury Loom
// writes) or through a [[mixins]] section in mods.toml. Nothing in the
// source tree states that, so a refactor can silently drop the declaration.
//
// The failure mode is nasty: the dev run still works, because Loom passes
// --mixin.config on the command line, and the server still starts, so
// `gradle build` and the smoke test both stay green while every mixin in
// the published jar is dead. This task looks at the jars that actually get
// uploaded instead, and fails the build when the wiring is missing.
//
// It also checks the reverse direction: every mixin class listed in the
// config has to exist in the jar, and the refmap has to be present and
// parseable. A stale entry in shmetro.mixins.json points at a class that
// was renamed or deleted, and Mixin would throw while starting the game.
//
// Usage: gradle checkMixinPackaging
tasks.register("checkMixinPackaging") {
	group = "verification"
	description = "Checks that the built jars declare the mixin config and that every listed mixin class and the refmap are present."
	dependsOn ":fabric:remapJar", ":forge:remapJar"
	doLast {
		def failures = []
		def checked = 0
		def mixinConfigName = "shmetro.mixins.json"

		def checkJar = { String loader, File jar ->
			if (jar == null || !jar.exists()) {
				failures << "${loader}: jar not found (${jar})"
				return
			}
			checked++
			def zip = new java.util.zip.ZipFile(jar)
			try {
				def entries = zip.entries().collect { it.name }
				def readText = { String name ->
					def e = zip.getEntry(name)
					if (e == null) return null
					return zip.getInputStream(e).getText("UTF-8")
				}

				// 1) the mixin config itself has to be in the jar
				if (!entries.contains(mixinConfigName)) {
					failures << "${loader}: ${mixinConfigName} is missing from the jar"
					return
				}

				// 2) the jar has to actually declare the config
				def declared = false
				if (loader == "fabric") {
					def modJson = readText("fabric.mod.json")
					if (modJson == null) {
						failures << "${loader}: fabric.mod.json is missing from the jar"
						return
					}
					def parsed = new groovy.json.JsonSlurper().parseText(modJson)
					def mixins = parsed."mixins"
					if (mixins instanceof List && mixins.contains(mixinConfigName)) {
						declared = true
					} else {
						failures << "${loader}: fabric.mod.json does not list ${mixinConfigName} in \"mixins\" (got: ${mixins})"
					}
				} else {
					// Forge: either the manifest attribute or a [[mixins]] section in mods.toml
					def manifest = readText("META-INF/MANIFEST.MF")
					if (manifest != null && manifest.readLines().any { it.trim() == "MixinConfigs: " + mixinConfigName }) {
						declared = true
					} else {
						def toml = readText("META-INF/mods.toml")
						if (toml != null && toml.contains("[[mixins]]") && toml.contains(mixinConfigName)) {
							declared = true
						} else {
							failures << "${loader}: the jar never declares ${mixinConfigName} (no MixinConfigs manifest attribute, no [[mixins]] section in mods.toml)"
						}
					}
				}

				// 3) every mixin class named in the config has to exist in the jar
				def config = new groovy.json.JsonSlurper().parseText(readText(mixinConfigName))
				def mixinClasses = []
				["server", "client"].each { side ->
					def list = config."${side}"
					if (list instanceof List) {
						mixinClasses.addAll(list.collect { "${config.package}.${it}" })
					}
				}
				if (mixinClasses.isEmpty()) {
					failures << "${loader}: ${mixinConfigName} does not list a single mixin class"
				}
				mixinClasses.each { className ->
					def path = className.replace(".", "/") + ".class"
					if (!entries.contains(path)) {
						failures << "${loader}: mixin class ${className} is listed in ${mixinConfigName} but is not in the jar"
					}
				}

				// 4) the refmap has to be there and has to be valid JSON.
				// The config points at one specific refmap by name, so that one
				// has to exist; scanning for any *.refmap.json is not enough,
				// a config pointing at a refmap that does not exist would
				// leave the mixins unmapped and break on the real game.
				def configRefmap = config.refmap
				if (!(configRefmap instanceof String) || configRefmap.trim().isEmpty()) {
					failures << "${loader}: ${mixinConfigName} does not name a refmap"
				} else {
					if (!entries.contains(configRefmap)) {
						failures << "${loader}: ${mixinConfigName} points at refmap '${configRefmap}', which is not in the jar"
					} else {
						try {
							new groovy.json.JsonSlurper().parseText(readText(configRefmap))
						} catch (Exception e) {
							failures << "${loader}: refmap ${configRefmap} is not valid JSON: ${e.message}"
						}
					}
				}
				def refmapNames = entries.findAll { it.endsWith(".refmap.json") }
				if (refmapNames.isEmpty()) {
					failures << "${loader}: no refmap (*.refmap.json) in the jar"
				}

				if (declared) {
					logger.lifecycle("checkMixinPackaging: ${loader} declares ${mixinConfigName} (${mixinClasses.size()} mixin class(es), refmap: ${refmapNames.join(", ")})")
				}
			} finally {
				zip.close()
			}
		}

		checkJar("fabric", file("${projectDir}/fabric/build/libs/shmetro-${rootProject.mod_version}-${rootProject.minecraft_version}-fabric.jar"))
		checkJar("forge", file("${projectDir}/forge/build/libs/shmetro-${rootProject.mod_version}-${rootProject.minecraft_version}-forge.jar"))

		if (!failures.isEmpty()) {
			throw new GradleException("checkMixinPackaging failed:\n  - " + failures.join("\n  - "))
		}
		logger.lifecycle("checkMixinPackaging: OK (${checked} jar(s) verified)")
	}
}

// Run the packaging check as part of every build: a jar that lost its mixin
// declaration still compiles and still starts, so nothing else would notice.
tasks.named("build") {
	dependsOn("checkMixinPackaging")
}

// Headless smoke test: actually start a dedicated server on both loaders and
// verify that the mod loads, that the mixins apply cleanly, and that nothing
// about shmetro shows up in the error log.
//
// BUILD SUCCESSFUL only proves the code compiles. Registry clashes, broken
// mixins and invalid refmaps only show up once the game starts, so this task
// exists to catch them before a release instead of after a player reports them.
//
// IMPORTANT: this task must NOT try to start the server itself by invoking
// gradle again. Gradle holds an exclusive lock on the project for the whole
// build, so a nested `gradle runServer` deadlocks on its configuration phase
// (observed: it hangs right after "preparing spawn area 0%"). The server is
// therefore started by tools/smoke-test.ps1, which runs gradle at top level.
//
// Usage:
//   powershell -ExecutionPolicy Bypass -File tools\smoke-test.ps1
//   gradle smokeTestCheck
tasks.register("smokeTestCheck") {
	group = "verification"
	description = "Checks the headless smoke-test logs written by tools/smoke-test.ps1."
	doLast {
		def loaders = ["fabric", "forge"]
		def failures = []
		def checked = 0
		loaders.each { loader ->
			def logFile = file("${loader}/run/logs/latest.log")
			if (!logFile.exists()) {
				failures << "${loader}: no log at ${logFile}. Run tools\\smoke-test.ps1 first."
				return
			}
			checked++
			def content = logFile.getText("UTF-8")
			def lines = content.readLines()
			if (!content.contains("The Shanghai Wetro Mod v")) {
				failures << "${loader}: the mod never reported that it loaded"
			}
			if (!(content =~ /Done \([\d.]+s\)!/)) {
				failures << "${loader}: the server never finished starting"
			}
			if (content =~ /MixinApplyError|InvalidInjectionException|MixinTransformerError|Critical injection failure/) {
				failures << "${loader}: a mixin failed to apply"
			}
			// The mixins of this mod all live in the "client" section of
			// shmetro.mixins.json, and a dedicated server never loads those.
			// So this log cannot tell us whether the client mixins work; that
			// is what the checkMixinPackaging task is for, it inspects the
			// jars that actually get published. What can be checked here is
			// that the server side of the mixin config (currently empty) stays
			// consistent with the log: a server mixin that fails to apply
			// leaves a visible error, and we must not report "mixins applied"
			// on the strength of a check that never looked at them.
			def mixinConfigFile = file("common/src/main/resources/shmetro.mixins.json")
			if (mixinConfigFile.exists()) {
				def cfg = new groovy.json.JsonSlurper().parseText(mixinConfigFile.getText("UTF-8"))
				def serverMixins = cfg."server"
				if (serverMixins instanceof List && !serverMixins.isEmpty()) {
					def sawServerMixin = content =~ /shmetro\.mixins\.json/
					if (!sawServerMixin) {
						failures << "${loader}: shmetro.mixins.json declares ${serverMixins.size()} server mixin(s) but the log never mentions the config"
					}
				}
			}
			def modErrors = lines.findAll { line ->
				line =~ /\/ERROR\]|\/FATAL\]/ && line =~ /shmetro|[Mm]ixin/
			}
			if (!modErrors.isEmpty()) {
				failures << "${loader}: " + modErrors.size() + " shmetro/mixin error line(s), first: " + modErrors[0].trim()
			}
		}
		if (!failures.isEmpty()) {
			throw new GradleException("smokeTestCheck failed:\n  - " + failures.join("\n  - "))
		}
		logger.lifecycle("smokeTestCheck: OK (${checked} loader(s) verified)")
	}
}

// Guard the release tooling itself.
//
// The smoke test script is the only thing that proves the mod actually runs,
// and it lives in the repository next to a pile of other helper scripts.
// A file that quietly goes missing (an over-eager cleanup, a sync tool, a
// virus scanner quarantining a .ps1) is invisible until the next release
// tries to run it, which is the worst possible moment to find out.
//
// This task only checks that the files are there and are not empty, so the
// failure shows up at build time instead of at release time.
//
// Usage: gradle checkTooling
tasks.register("checkTooling") {
	group = "verification"
	description = "Checks that the release tooling scripts are present and not empty."
	doLast {
		def required = [
			"tools/smoke-test.ps1"
		]
		def failures = []
		required.each { path ->
			def f = file(path)
			if (!f.exists()) {
				failures << "${path} is missing (restore it with: git checkout -- ${path})"
			} else if (f.length() == 0L) {
				failures << "${path} is empty"
			}
		}
		if (!failures.isEmpty()) {
			throw new GradleException("checkTooling failed:\n  - " + failures.join("\n  - "))
		}
		logger.lifecycle("checkTooling: OK (${required.size()} script(s) present)")
	}
}

tasks.named("build") {
	dependsOn("checkTooling")
	dependsOn("checkMixinTargets")
}
