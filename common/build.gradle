plugins {
	id "com.gradleup.shadow" version "9.4.2"
}

dependencies {
	compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

architectury {
	common("fabric", "forge")
}

loom {
	mixin {
		defaultRefmapName = "mixins.shmetro.refmap.json"
	}
}

java {
	withSourcesJar()
}

// Fail the build when Main.MOD_VERSION drifts from gradle.properties' mod_version,
// so a release can never ship a stale version string in the startup log.
tasks.register("checkModVersion") {
	def mainSource = file("src/main/java/com/xhg78999/shmetro/Main.java")
	def declared = rootProject.mod_version
	inputs.file(mainSource)
	inputs.property("modVersion", declared)
	doLast {
		def matcher = mainSource.text =~ /MOD_VERSION\s*=\s*"([^"]+)"/
		if (!matcher.find()) {
			throw new GradleException("checkModVersion: MOD_VERSION constant not found in Main.java")
		}
		def inCode = matcher.group(1)
		if (inCode != declared) {
			throw new GradleException("checkModVersion: Main.MOD_VERSION=${inCode} but gradle.properties mod_version=${declared}; keep them in sync")
		}
	}
}

tasks.named("compileJava") {
	dependsOn("checkModVersion")
}

// Fail the build when an asset reference is dangling.
//
// Minecraft resolves blockstate -> model -> texture purely by path, and a
// missing file is NOT a compile error: the game silently shows the purple
// "missing texture" checkerboard. The same goes for a block that was
// registered in code but never got a blockstate/model, and for a lang key
// referenced from Java but absent from en_us.json / zh_cn.json.
//
// This task walks those chains and fails the build, so a broken link is
// caught at build time instead of by a player reporting a purple box.
//
// Scope (namespace "shmetro" only, foreign namespaces live in other jars):
//   1. every registered block/item name has a matching blockstate file
//   2. every blockstate's "model" reference resolves to an existing model
//   3. every model's "texture" reference resolves to an existing png
//   4. every item model's "parent" resolves (shmetro namespace only)
//   5. every translatable key used in Java exists in every lang file
//      (both plain literals and prefixes that are concatenated at runtime)
tasks.register("checkResourceLinks") {
	def assetsDir = file("src/main/resources/assets/shmetro")
	def langDir = file("src/main/resources/assets/shmetro/lang")
	def sourceDir = file("src/main/java")
	def mainSource = file("src/main/java/com/xhg78999/shmetro/Main.java")
	def langFiles = fileTree(langDir) { include "*.json" }
	inputs.dir(assetsDir).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(sourceDir).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(mainSource)
	inputs.files(langFiles)
	// A version bump on its own must not re-run this; only resource/source edits should.
	outputs.upToDateWhen { false }
	doLast {
		def problems = []
		def modelsDir = new File(assetsDir, "models")
		def texturesDir = new File(assetsDir, "textures")
		def javaFiles = fileTree(sourceDir) { include "**/*.java" }.files

		// model id "shmetro:block/foo" -> models/block/foo.json
		// Only the "shmetro" namespace is ours; "minecraft:item/generated" and
		// friends live in the vanilla/other jars and are not our responsibility.
		def resolveModel = { String ref ->
			if (ref == null) return null
			// Only the "shmetro" namespace (and bare refs, which default to
			// minecraft: for parents / shmetro: for blockstates) is ours.
			// "mtr:*" parents live in the MTR jar and are not our responsibility.
			if (ref.startsWith("minecraft:")) return null
			if (ref.startsWith("mtr:")) return null
			def rel = ref.contains(":") ? ref.substring(ref.indexOf(":") + 1) : ref
			// A bare "item/generated" is vanilla's built-in parent, not a shmetro file.
			if (!ref.contains(":") && (rel.startsWith("item/") || rel.startsWith("block/"))) return null
			return new File(modelsDir, rel + ".json")
		}

		// 1) registered names -> blockstate
		def mainText = mainSource.getText("UTF-8")
		def registered = [] as Set
		def regMatcher = mainText =~ /register(?:BlockAndItem|Block|Item)\("([a-z0-9_]+)"/ 
		while (regMatcher.find()) {
			registered.add(regMatcher.group(1))
		}
		def blockstatesDir = new File(assetsDir, "blockstates")
		registered.each { String name ->
			if (!new File(blockstatesDir, name + ".json").exists()) {
				problems << "registered '" + name + "' has no blockstates/" + name + ".json"
			}
		}

		// 1b) registered names -> loot table
		// A block without a loot table drops nothing when mined, which is easy to
		// overlook and never shows up as an error in game. Most blocks should have
		// one; the exceptions are listed explicitly below.
		//
		// The exceptions are all inherited from MTR's own base classes
		// (BlockPSDDoor / BlockPSDGlass / BlockPSDTop and the railing doors):
		// their BlockBehaviour.Properties come from MTR, which never calls
		// noLootTable(), so upstream ships exactly the same set without loot
		// tables. The two shmetro blocks that DO call noLootTable() explicitly
		// are BlockShanghaiPSDTop and BlockShanghaiSign.
		def noLootTableExpected = [
			"erailing_door_1", "erailing_door_2", "erailing_glass_1", "erailing_glass_2",
			"psd_door_blank", "psd_door_railmap", "psd_door_runin",
			"psd_end", "psd_glass_blank", "psd_glass_destination", "psd_glass_railmap",
			"psd_top", "shm_sign_middle"
		] as Set
		def lootTablesDir = file("src/main/resources/data/shmetro/loot_tables/blocks")
		registered.each { String name ->
			if (noLootTableExpected.contains(name)) return
			if (!new File(lootTablesDir, name + ".json").exists()) {
				problems << "registered '" + name + "' has no loot_tables/blocks/" + name + ".json"
			}
		}
		// The other direction: a loot table for a block that does not exist is
		// dead weight that never fires.
		if (lootTablesDir.exists()) {
			fileTree(lootTablesDir) { include "*.json" }.files.each { File f ->
				def name = f.name.replaceAll(/\.json$/, "")
				if (!registered.contains(name)) {
					problems << "loot_tables/blocks/" + f.name + " has no registered block named '" + name + "'"
				}
			}
		}

		// 2) blockstate -> model
		def blockstateFiles = fileTree(blockstatesDir) { include "*.json" }.files
		blockstateFiles.each { File f ->
			def txt = f.getText("UTF-8")
			def m = txt =~ /"model"\s*:\s*"([^"]+)"/
			def seen = [] as Set
			while (m.find()) {
				def ref = m.group(1)
				if (!seen.add(ref)) continue
				def target = resolveModel(ref)
				if (target != null && !target.exists()) {
					problems << "blockstates/" + f.name + " references missing model '" + ref + "'"
				}
			}
		}

		// 3) model -> texture, 4) item model -> parent
		def modelFiles = fileTree(modelsDir) { include "**/*.json" }.files
		modelFiles.each { File f ->
			def txt = f.getText("UTF-8")
			def t = txt =~ /"texture"\s*:\s*"([^"]+)"/
			while (t.find()) {
				def ref = t.group(1)
				if (ref.startsWith("#") || ref.startsWith("minecraft:")) continue
				def rel = ref.contains(":") ? ref.substring(ref.indexOf(":") + 1) : ref
				if (!new File(texturesDir, rel + ".png").exists()) {
					problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") + " references missing texture '" + ref + "'"
				}
			}
			def p = txt =~ /"parent"\s*:\s*"([^"]+)"/
			while (p.find()) {
				def ref = p.group(1)
				if (ref.startsWith("minecraft:")) continue
				def target = resolveModel(ref)
				if (target != null && !target.exists()) {
					problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") + " references missing parent '" + ref + "'"
				}
			}
		}

		// 5) translatable keys used in Java -> lang files
		def langKeys = [:]
		langFiles.files.each { File lf ->
			def txt = lf.getText("UTF-8")
			def k = txt =~ /"((?:gui|tooltip|block|item|config)\.[^"]+)"\s*:/
			def set = [] as Set
			while (k.find()) {
				set.add(k.group(1))
			}
			langKeys[lf.name] = set
		}
		// Two extraction patterns, because keys appear in more shapes than a
		// plain literal right after translatable(:
		//   a) a full key literal anywhere in a Java string, e.g. the ternary in
		//      Text.translatable(cond ? "gui.shmetro.a" : "gui.shmetro.b")
		//   b) a literal PREFIX that gets concatenated with a dynamic part, e.g.
		//      "tooltip.shmetro." + (type == 1 ? "railmap" : "blank")
		//      We cannot know the exact key here, but we CAN require that at
		//      least one lang entry starts with that prefix; if a rename orphans
		//      the whole prefix family this still catches it.
		def ourPrefixes = ["gui.shmetro.", "tooltip.shmetro.", "block.shmetro.", "item.shmetro.", "config.shmetro."]
		def fullKeys = [] as Set
		def concatPrefixes = [] as Set
		javaFiles.each { File jf ->
			def txt = jf.getText("UTF-8")
			// (a) any string literal that already starts with one of our prefixes
			def full = txt =~ /"((?:gui|tooltip|block|item|config)\.shmetro\.[a-z0-9_.]+)"/
			while (full.find()) {
				fullKeys.add(full.group(1))
			}
			// (b) a string literal ending right where concatenation begins,
			//     i.e. "..." followed by optional whitespace and a '+'
			def concat = txt =~ /"((?:gui|tooltip|block|item|config)\.shmetro\.[a-z0-9_.]*)"\s*\+/
			while (concat.find()) {
				concatPrefixes.add(concat.group(1))
			}
		}
		// (a) full keys: exact match required in every lang file
		langKeys.each { String name, Set keys ->
			fullKeys.each { String used ->
				if (!keys.contains(used)) {
					problems << "lang/" + name + " is missing key '" + used + "'"
				}
			}
		}
		// (b) prefixes: at least one lang entry must start with the prefix
		langKeys.each { String name, Set keys ->
			concatPrefixes.each { String prefix ->
				def any = keys.any { it.startsWith(prefix) }
				if (!any) {
					problems << "lang/" + name + " has no entry under prefix '" + prefix + "' (referenced via string concatenation)"
				}
			}
		}

		if (!problems.isEmpty()) {
			def message = "checkResourceLinks: " + problems.size() + " dangling resource reference(s):"
			problems.each { message += "\n  - " + it }
			throw new GradleException(message)
		}
		def lootCount = lootTablesDir.exists() ? fileTree(lootTablesDir) { include "*.json" }.files.size() : 0
		logger.lifecycle("checkResourceLinks: OK (" + registered.size() + " registered, " +
			blockstateFiles.size() + " blockstates, " + modelFiles.size() + " models, " +
			lootCount + " loot tables, " +
			langKeys.size() + " lang files, " + fullKeys.size() + " key literals, " +
			concatPrefixes.size() + " concatenated key prefix(es))")
	}
}

tasks.named("processResources") {
	dependsOn("checkResourceLinks")
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 17
}

