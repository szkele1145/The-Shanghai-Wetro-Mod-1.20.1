plugins {
	id "com.gradleup.shadow" version "9.4.2"
}

dependencies {
	compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

architectury {
	common("fabric", "forge")
}

loom {
	mixin {
		defaultRefmapName = "mixins.shmetro.refmap.json"
	}
}

java {
	withSourcesJar()
}

// Fail the build when Main.MOD_VERSION drifts from gradle.properties' mod_version,
// so a release can never ship a stale version string in the startup log.
tasks.register("checkModVersion") {
	def mainSource = file("src/main/java/com/xhg78999/shmetro/Main.java")
	def declared = rootProject.mod_version
	inputs.file(mainSource)
	inputs.property("modVersion", declared)
	doLast {
		def matcher = mainSource.text =~ /MOD_VERSION\s*=\s*"([^"]+)"/
		if (!matcher.find()) {
			throw new GradleException("checkModVersion: MOD_VERSION constant not found in Main.java")
		}
		def inCode = matcher.group(1)
		if (inCode != declared) {
			throw new GradleException("checkModVersion: Main.MOD_VERSION=${inCode} but gradle.properties mod_version=${declared}; keep them in sync")
		}
	}
}

tasks.named("compileJava") {
	dependsOn("checkModVersion")
}

// Fail the build when an asset reference is dangling.
//
// Minecraft resolves blockstate -> model -> texture purely by path, and a
// missing file is NOT a compile error: the game silently shows the purple
// "missing texture" checkerboard. The same goes for a block that was
// registered in code but never got a blockstate/model, and for a lang key
// referenced from Java but absent from en_us.json / zh_cn.json.
//
// This task walks those chains and fails the build, so a broken link is
// caught at build time instead of by a player reporting a purple box.
//
// Scope (namespace "shmetro" only, foreign namespaces live in other jars):
//   1. every registered block/item name has a matching blockstate file
//   2. every blockstate's "model" reference resolves to an existing model
//   3. every model's "texture" reference resolves to an existing png
//   4. every item model's "parent" resolves (shmetro namespace only)
//   5. every translatable key used in Java exists in every lang file
//      (both plain literals and prefixes that are concatenated at runtime)
tasks.register("checkResourceLinks") {
	def assetsDir = file("src/main/resources/assets/shmetro")
	def langDir = file("src/main/resources/assets/shmetro/lang")
	def sourceDir = file("src/main/java")
	def mainSource = file("src/main/java/com/xhg78999/shmetro/Main.java")
	def langFiles = fileTree(langDir) { include "*.json" }
	inputs.dir(assetsDir).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(sourceDir).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(mainSource)
	inputs.files(langFiles)
	// A version bump on its own must not re-run this; only resource/source edits should.
	outputs.upToDateWhen { false }
	doLast {
		def problems = []
		def modelsDir = new File(assetsDir, "models")
		def texturesDir = new File(assetsDir, "textures")
		def javaFiles = fileTree(sourceDir) { include "**/*.java" }.files

		// model id "shmetro:block/foo" -> models/block/foo.json
		// Only the "shmetro" namespace is ours; "minecraft:item/generated" and
		// friends live in the vanilla/other jars and are not our responsibility.
		def resolveModel = { String ref ->
			if (ref == null) return null
			// Only the "shmetro" namespace (and bare refs, which default to
			// minecraft: for parents / shmetro: for blockstates) is ours.
			// "mtr:*" parents live in the MTR jar and are not our responsibility.
			if (ref.startsWith("minecraft:")) return null
			if (ref.startsWith("mtr:")) return null
			def rel = ref.contains(":") ? ref.substring(ref.indexOf(":") + 1) : ref
			// A bare "item/generated" is vanilla's built-in parent, not a shmetro file.
			if (!ref.contains(":") && (rel.startsWith("item/") || rel.startsWith("block/"))) return null
			return new File(modelsDir, rel + ".json")
		}

		// 1) registered names -> blockstate
		def mainText = mainSource.getText("UTF-8")
		def registered = [] as Set
		def regMatcher = mainText =~ /register(?:BlockAndItem|Block|Item)\("([a-z0-9_]+)"/ 
		while (regMatcher.find()) {
			registered.add(regMatcher.group(1))
		}
		def blockstatesDir = new File(assetsDir, "blockstates")
		registered.each { String name ->
			if (!new File(blockstatesDir, name + ".json").exists()) {
				problems << "registered '" + name + "' has no blockstates/" + name + ".json"
			}
		}

		// 1b) registered names -> loot table
		// A block without a loot table drops nothing when mined, which is easy to
		// overlook and never shows up as an error in game. Most blocks should have
		// one; the exceptions are listed explicitly below.
		//
		// The exceptions are all inherited from MTR's own base classes
		// (BlockPSDDoor / BlockPSDGlass / BlockPSDTop and the railing doors):
		// their BlockBehaviour.Properties come from MTR, which never calls
		// noLootTable(), so upstream ships exactly the same set without loot
		// tables. The two shmetro blocks that DO call noLootTable() explicitly
		// are BlockShanghaiPSDTop and BlockShanghaiSign.
		def noLootTableExpected = [
			"erailing_door_1", "erailing_door_2", "erailing_glass_1", "erailing_glass_2",
			"psd_door_blank", "psd_door_railmap", "psd_door_runin",
			"psd_end", "psd_glass_blank", "psd_glass_destination", "psd_glass_railmap",
			"psd_top", "shm_sign_middle"
		] as Set
		def lootTablesDir = file("src/main/resources/data/shmetro/loot_tables/blocks")
		registered.each { String name ->
			if (noLootTableExpected.contains(name)) return
			if (!new File(lootTablesDir, name + ".json").exists()) {
				problems << "registered '" + name + "' has no loot_tables/blocks/" + name + ".json"
			}
		}
		// The other direction: a loot table for a block that does not exist is
		// dead weight that never fires.
		if (lootTablesDir.exists()) {
			fileTree(lootTablesDir) { include "*.json" }.files.each { File f ->
				def name = f.name.replaceAll(/\.json$/, "")
				if (!registered.contains(name)) {
					problems << "loot_tables/blocks/" + f.name + " has no registered block named '" + name + "'"
				}
			}
		}

		// 2) blockstate -> model
		def blockstateFiles = fileTree(blockstatesDir) { include "*.json" }.files
		blockstateFiles.each { File f ->
			def txt = f.getText("UTF-8")
			def m = txt =~ /"model"\s*:\s*"([^"]+)"/
			def seen = [] as Set
			while (m.find()) {
				def ref = m.group(1)
				if (!seen.add(ref)) continue
				def target = resolveModel(ref)
				if (target != null && !target.exists()) {
					problems << "blockstates/" + f.name + " references missing model '" + ref + "'"
				} else if (target != null) {
					// Case has to match exactly, see the note in the texture
					// check below.
					def actual = target.parentFile.listFiles()?.find { it.name == target.name }
					if (actual == null) {
						problems << "blockstates/" + f.name + " references model '" + ref +
							"', but the file on disk has a different case (found " +
							(target.parentFile.listFiles()?.find { it.name.equalsIgnoreCase(target.name) }?.name ?: "nothing") + ")"
					}
				}
			}
		}

		// 3) model -> texture, 4) item model -> parent
		def modelFiles = fileTree(modelsDir) { include "**/*.json" }.files
		modelFiles.each { File f ->
			def txt = f.getText("UTF-8")
			// A model names its textures in the "textures" map:
			//     "textures": { "0": "shmetro:block/aed", "particle": "..." }
			// The singular "texture" key belongs to the faces, where the
			// value is a reference to an entry of that map ("#0"), not a
			// texture path. Matching the singular one only ever saw the
			// face references and skipped all of them, so the texture
			// names in the map were never checked at all.
			def t = txt =~ /"textures"\s*:\s*\{([^}]*)\}/
			while (t.find()) {
				def m2 = t.group(1) =~ /"([^"]+)"\s*:\s*"([^"]+)"/
				while (m2.find()) {
					def ref = m2.group(2)
					if (ref.startsWith("#") || ref.startsWith("minecraft:")) continue
					// A texture from another mod (mtr:block/metal and
					// friends) lives in that mod's jar, not in this project.
					if (ref.contains(":") && !ref.startsWith("shmetro:")) continue
					def rel = ref.contains(":") ? ref.substring(ref.indexOf(":") + 1) : ref
					def target = new File(texturesDir, rel + ".png")
					if (!target.exists()) {
						problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") + " references missing texture '" + ref + "'"
					} else {
						// The file system on the build machine is usually case
						// insensitive, so a plain exists() would accept
						// "Arrow_Left.png" for "arrow_left.png". The game does
						// not work that way: the resource system matches the
						// path as written, and a Linux server would come up
						// with a missing texture that the developer never
						// sees.
						def actual = target.parentFile.listFiles()?.find { it.name == target.name }
						if (actual == null) {
							problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") +
								" references texture '" + ref + "', but the file on disk has a different case (found " +
								(target.parentFile.listFiles()?.find { it.name.equalsIgnoreCase(target.name) }?.name ?: "nothing") + ")"
						}
					}
				}
			}
			def p = txt =~ /"parent"\s*:\s*"([^"]+)"/
			while (p.find()) {
				def ref = p.group(1)
				if (ref.startsWith("minecraft:")) continue
				def target = resolveModel(ref)
				if (target != null && !target.exists()) {
					problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") + " references missing parent '" + ref + "'"
				} else if (target != null) {
					def actual = target.parentFile.listFiles()?.find { it.name == target.name }
					if (actual == null) {
						problems << f.path.replace(assetsDir.path + File.separator, "assets/shmetro/") +
							" references parent '" + ref + "', but the file on disk has a different case (found " +
							(target.parentFile.listFiles()?.find { it.name.equalsIgnoreCase(target.name) }?.name ?: "nothing") + ")"
					}
				}
			}
		}

		// 5) translatable keys used in Java -> lang files
		def langKeys = [:]
		langFiles.files.each { File lf ->
			def txt = lf.getText("UTF-8")
			def k = txt =~ /"((?:gui|tooltip|block|item|config)\.[^"]+)"\s*:/
			def set = [] as Set
			while (k.find()) {
				set.add(k.group(1))
			}
			langKeys[lf.name] = set
		}
		// Two extraction patterns, because keys appear in more shapes than a
		// plain literal right after translatable(:
		//   a) a full key literal anywhere in a Java string, e.g. the ternary in
		//      Text.translatable(cond ? "gui.shmetro.a" : "gui.shmetro.b")
		//   b) a literal PREFIX that gets concatenated with a dynamic part, e.g.
		//      "tooltip.shmetro." + (type == 1 ? "railmap" : "blank")
		//      We cannot know the exact key here, but we CAN require that at
		//      least one lang entry starts with that prefix; if a rename orphans
		//      the whole prefix family this still catches it.
		def ourPrefixes = ["gui.shmetro.", "tooltip.shmetro.", "block.shmetro.", "item.shmetro.", "config.shmetro."]
		def fullKeys = [] as Set
		def concatPrefixes = [] as Set
		javaFiles.each { File jf ->
			def txt = jf.getText("UTF-8")
			// (a) any string literal that already starts with one of our prefixes
			def full = txt =~ /"((?:gui|tooltip|block|item|config)\.shmetro\.[a-z0-9_.]+)"/
			while (full.find()) {
				fullKeys.add(full.group(1))
			}
			// (b) a string literal ending right where concatenation begins,
			//     i.e. "..." followed by optional whitespace and a '+'
			def concat = txt =~ /"((?:gui|tooltip|block|item|config)\.shmetro\.[a-z0-9_.]*)"\s*\+/
			while (concat.find()) {
				concatPrefixes.add(concat.group(1))
			}
		}
		// (a) full keys: exact match required in every lang file
		langKeys.each { String name, Set keys ->
			fullKeys.each { String used ->
				if (!keys.contains(used)) {
					problems << "lang/" + name + " is missing key '" + used + "'"
				}
			}
		}
		// (b) prefixes: at least one lang entry must start with the prefix
		langKeys.each { String name, Set keys ->
			concatPrefixes.each { String prefix ->
				def any = keys.any { it.startsWith(prefix) }
				if (!any) {
					problems << "lang/" + name + " has no entry under prefix '" + prefix + "' (referenced via string concatenation)"
				}
			}
		}

		// (7) Resource locations that Java builds by hand.
		//
		// The model -> texture chain above never sees these: they are string
		// literals inside the code, e.g.
		//     new ResourceLocation("shmetro", "textures/rendering/arrow_left.png")
		//     new ResourceLocation("shmetro", "font/arial.ttf")
		// A typo in one of them is invisible to every other check and only
		// shows up on a player's screen as a missing font or a blank arrow.
		//
		// Only our own namespace can be checked here: the paths that point at
		// another mod (mtr:textures/gui/icon_left.png) live in that mod's jar,
		// which is not part of this project.
		//
		// Not every resource location names a file. Some are identifiers: a
		// creative tab id ("navigation"), a network packet id
		// ("packet_shm_sign_types"). Those have no file behind them, so only
		// the ones that look like a path are checked, plus the font ids,
		// which do have a file (assets/<ns>/font/<id>.json).
		def ours = [] as Set
		def fontIds = [] as Set
		def foreign = [] as Set
		javaFiles.each { File jf ->
			def txt = jf.getText("UTF-8")
			// Two shapes: the two argument form
			//     new ResourceLocation("shmetro", "textures/thing.png")
			// and the one argument form, where the namespace is part of the
			// string
			//     new ResourceLocation("shmetro:textures/thing.png")
			// Both can point at our own assets, so both have to be looked at.
			// The namespace and the path are not restricted to lower case
			// letters, so keep the character classes wide open: a path with
			// an upper case letter in it has to be matched too, otherwise the
			// check silently skips it.
			def two = ~/(?:new\s+)?ResourceLocation\s*\(\s*"([^"]+)"\s*,\s*"([^"]+)"\s*\)/
			def one = ~/(?:new\s+)?ResourceLocation\s*\(\s*"([^":\s]+):([^"]+)"\s*\)/
			[two, one].each { re ->
				def m = re.matcher(txt)
				while (m.find()) {
					if (m.group(1) != "shmetro") {
						foreign.add(m.group(1) + ":" + m.group(2))
						continue
					}
					def path = m.group(2)
					// A font id is passed to withFont(...) and resolves to
					// assets/<ns>/font/<id>.json.
					def before = txt.substring(Math.max(0, m.start() - 40), m.start())
					if (before =~ /withFont\s*\(\s*$/) {
						fontIds.add(path)
					} else if (path.contains("/") || path.contains(".")) {
						ours.add(path)
					}
				}
			}
		}
		ours.each { String path ->
			// Compare the file names case sensitively. On Windows a lookup
			// would happily find "Arrow_Left.png" for "arrow_left.png", but
			// the resource system is not case insensitive everywhere: a
			// Linux server that runs the same mod would not find the file
			// and the texture would silently go missing there.
			def target = new File(assetsDir, path)
			if (!target.exists()) {
				problems << "assets/shmetro/" + path + " is referenced by Java but does not exist"
			} else {
				def parent = target.parentFile
				def wanted = target.name
				def actual = parent.listFiles()?.find { it.name == wanted }
				if (actual == null) {
					problems << "assets/shmetro/" + path + " is referenced by Java, but the file on disk has a different case (found " +
						(parent.listFiles()?.find { it.name.equalsIgnoreCase(wanted) }?.name ?: "nothing") + ")"
				}
			}
		}
		fontIds.each { String id ->
			if (!new File(new File(assetsDir, "font"), id + ".json").exists()) {
				problems << "font id '" + id + "' is referenced by Java but assets/shmetro/font/" + id + ".json does not exist"
			}
		}
		// A font provider names its ttf as "<ns>:<file>" inside the font json.
		// Those files are looked up in assets/<ns>/font/, so check them too.
		def fontDir = new File(assetsDir, "font")
		if (fontDir.exists()) {
			fontDir.listFiles()?.each { File ff ->
				if (!ff.name.endsWith(".json")) return
				def txt = ff.getText("UTF-8")
				// The file name may contain any character that is legal in a
				// resource path, so do not narrow it down to a character
				// class: a path with an upper case letter in it has to be
				// matched too, otherwise the check silently skips it.
				def re = ~/"file"\s*:\s*"([^":\s]+):([^"]+)"/
				def m = re.matcher(txt)
				while (m.find()) {
					if (m.group(1) != "shmetro") continue
					def target = new File(fontDir, m.group(2))
					if (!target.exists()) {
						problems << "assets/shmetro/font/" + ff.name + " names provider file '" + m.group(2) + "', which does not exist"
						continue
					}
					// Case matters here too, see the note above.
					def actual = fontDir.listFiles()?.find { it.name == target.name }
					if (actual == null) {
						problems << "assets/shmetro/font/" + ff.name + " names provider file '" + m.group(2) + "', but the file on disk has a different case"
					}
				}
			}
		}

		// 8) blockstate variant keys -> state properties that really exist.
		//
		// A variant key names the state properties it applies to, for
		// example "type=0,facing=north". If it names a property the block
		// does not have, Minecraft cannot resolve the variant: the model is
		// never loaded and the block shows up as the missing model. The
		// property names in a multipart "when" condition work the same way.
		//
		// The set of properties that exist is derived from the source:
		//   - Property.create("name") spells out the real name,
		//   - a constant that is added to the state definition names its
		//     property after the constant, which is how Minecraft and MTR
		//     do it (FACING -> "facing", HALF -> "half",
		//     TOUCHING_LEFT -> "touching_left", ...).
		// Both are collected, so a property that is inherited from a base
		// class counts as well. Nothing here is hard coded, so renaming a
		// property in the source automatically updates the check.
		def declaredStateProperties = [] as Set
		javaFiles.each { File jf ->
			def txt = jf.getText("UTF-8")
			def created = txt =~ /\b(?:IntegerProperty|BooleanProperty|EnumProperty|DirectionProperty)\s*\.\s*create\s*\(\s*(?:\(String\))?"([^"]+)"/
			while (created.find()) {
				declaredStateProperties.add(created.group(1))
			}
			def added = txt =~ /add\s*\(\s*new\s+Property\[\]\s*\{([^}]*)\}\s*\)/
			while (added.find()) {
				added.group(1).split(",").each { String p ->
					p = p.trim()
					if (p) declaredStateProperties.add(p.toLowerCase())
				}
			}
			def addedOne = txt =~ /addProperty\s*\(\s*([A-Za-z0-9_.]+)\s*\)/
			while (addedOne.find()) {
				// "." is a regex metacharacter, it has to be escaped here or
				// split returns an empty array.
				declaredStateProperties.add(addedOne.group(1).split(/\./)[-1].toLowerCase())
			}
		}
		// A block class can also inherit its whole state definition from an
		// MTR base class without ever spelling the properties out again (the
		// psd_end block never calls createBlockStateDefinition). Those names
		// only exist inside the MTR jar, so scan it as well: every snake_case
		// string constant in an mtr/block class is a candidate property name.
		// The net is deliberately wide for the jar - a wrong name written in
		// this project's sources never collides with anything in it, which is
		// the typo this check is here for.
		def mtrJar = rootProject.file("checkouts/${rootProject.minecraft_version}/mtr-common.jar")
		if (mtrJar.exists()) {
			def poolStrings = { byte[] data ->
				def out = [] as Set
				if (data.length < 10 || data[0] != (byte)0xCA || data[1] != (byte)0xFE || data[2] != (byte)0xBA || data[3] != (byte)0xBE) return out
				def count = ((data[8] & 0xFF) << 8) | (data[9] & 0xFF)
				def i = 10
				for (def n = 1; n < count && i < data.length; n++) {
					def tag = data[i]; i++
					if (tag == 1) {
						def len = ((data[i] & 0xFF) << 8) | (data[i + 1] & 0xFF); i += 2
						out.add(new String(data, i, len, "UTF-8")); i += len
					} else if (tag == 3 || tag == 4) { i += 4 }
					else if (tag == 5 || tag == 6) { i += 8; n++ }
					else if (tag == 7 || tag == 8 || tag == 16 || tag == 19 || tag == 20) { i += 2 }
					else if (tag == 9 || tag == 10 || tag == 11 || tag == 12 || tag == 17 || tag == 18) { i += 4 }
					else if (tag == 15) { i += 3 }
					else { break }
				}
				return out
			}
			new java.util.zip.ZipFile(mtrJar).withCloseable { zip ->
				zip.entries().toList().each { entry ->
					if (!entry.name.startsWith("mtr/block/") || !entry.name.endsWith(".class")) return
					poolStrings(zip.getInputStream(entry).getBytes()).each { String s ->
						if (s ==~ /[a-z][a-z0-9_]{2,30}/) declaredStateProperties.add(s)
					}
				}
			}
		}
		def checkStatePropertyName = { String where, String name ->
			if (!declaredStateProperties.contains(name)) {
				problems << where + " uses state property '" + name + "', but no such property is declared"
			}
		}
		blockstateFiles.each { File f ->
			def txt = f.getText("UTF-8")
			// "facing=north" or "type=0,facing=north"
			def variant = txt =~ /"((?:[a-z_]+=[a-z0-9_]+,?)+)"\s*:\s*\{/
			while (variant.find()) {
				variant.group(1).split(",").each { String kv ->
					if (!kv.contains("=")) return
					checkStatePropertyName("blockstates/" + f.name, kv.substring(0, kv.indexOf("=")).trim())
				}
			}
			// "when": { "facing": "west" }
			def when = txt =~ /"when"\s*:\s*\{([^}]*)\}/
			while (when.find()) {
				def key = when.group(1) =~ /"([^"]+)"\s*:/
				while (key.find()) {
					checkStatePropertyName("blockstates/" + f.name, key.group(1))
				}
			}
		}

		// 9) every json file under the resources must actually parse.
		//
		// Minecraft reads these files with a json parser and silently skips
		// the ones it cannot read, so a stray comma turns a block into the
		// missing model without a single error message. The build is the
		// only place where this can be caught cheaply.
		def jsonFiles = fileTree("src/main/resources") { include "**/*.json" }.files
		jsonFiles.each { File f ->
			try {
				def parsed = new groovy.json.JsonSlurper().parse(f, "UTF-8")
				if (!(parsed instanceof Map || parsed instanceof List)) {
					problems << "resources/" + f.path.replace(file("src/main/resources").path + File.separator, "") +
						" does not contain a json object or array"
				}
			} catch (Exception e) {
				problems << "resources/" + f.path.replace(file("src/main/resources").path + File.separator, "") +
					" is not valid json: " + e.message
			}
		}

		if (!problems.isEmpty()) {
			def message = "checkResourceLinks: " + problems.size() + " dangling resource reference(s):"
			problems.each { message += "\n  - " + it }
			throw new GradleException(message)
		}
		def lootCount = lootTablesDir.exists() ? fileTree(lootTablesDir) { include "*.json" }.files.size() : 0
		logger.lifecycle("checkResourceLinks: OK (" + registered.size() + " registered, " +
			blockstateFiles.size() + " blockstates, " + modelFiles.size() + " models, " +
			lootCount + " loot tables, " +
			langKeys.size() + " lang files, " + fullKeys.size() + " key literals, " +
			concatPrefixes.size() + " concatenated key prefix(es), " +
			ours.size() + " java resource path(s), " + fontIds.size() + " font id(s), " +
			foreign.size() + " foreign reference(s), " +
			declaredStateProperties.size() + " state properties, " +
			jsonFiles.size() + " json files parsed)")
	}
}

tasks.named("processResources") {
	dependsOn("checkResourceLinks")
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 17
}

