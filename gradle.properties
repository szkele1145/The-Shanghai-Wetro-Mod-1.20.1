# Gradle 配置
org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=false

# 代理 (本地系统代理; wrapper 下载分发版与构建期依赖仓库均走此代理)

